name: Trigger auto deployment for gym-management-pso

# When this action will be executed
on:
  workflow_run:
    workflows: ["PHP CI"]
    types:
      - completed
    branches: [master]

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GYMMANAGEMENTPSO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GYMMANAGEMENTPSO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GYMMANAGEMENTPSO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ./Dockerfile
          registryUrl: gymmanagementacr-dhfng6eshecncjeq.azurecr.io
          registryUsername: ${{ secrets.GYMMANAGEMENTPSO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GYMMANAGEMENTPSO_REGISTRY_PASSWORD }}
          containerAppName: gym-management-pso
          resourceGroup: gym-management-rg
          imageToBuild: gymmanagementacr-dhfng6eshecncjeq.azurecr.io/gym-management-pso:${{ github.sha }}



